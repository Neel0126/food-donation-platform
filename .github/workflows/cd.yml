name: CD — Build & Push Docker Images

on:
  push:
    branches: [main]          # Triggers on merge to main
  workflow_dispatch:           # Allow manual trigger from GitHub UI

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  SERVER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/food-donation-server
  CLIENT_IMAGE: ${{ secrets.DOCKER_USERNAME }}/food-donation-client

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build & push backend image
  # ─────────────────────────────────────────────
  build-server:
    name: Build & Push Server Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & Push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          dockerfile: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 2: Build & push frontend image
  # ─────────────────────────────────────────────
  build-client:
    name: Build & Push Client Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CLIENT_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & Push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          dockerfile: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || 'http://localhost:5000/api' }}

  # ─────────────────────────────────────────────
  # JOB 3: Notify on success
  # ─────────────────────────────────────────────
  notify:
    name: Notify Deploy Success
    runs-on: ubuntu-latest
    needs: [build-server, build-client]

    steps:
      - name: Summary
        run: |
          echo "## ✅ Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.SERVER_IMAGE }}\` | \`latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.CLIENT_IMAGE }}\` | \`latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

